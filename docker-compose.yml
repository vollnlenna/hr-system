version: '3.8'

services:
  db:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  api:
    build:
      context: ./api
      dockerfile: ../containers/api/Dockerfile
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
      - redis
    volumes:
      - ./storage:/app/storage
    networks:
      - default

  app:
    build:
      context: ./app
      dockerfile: ../containers/app/Dockerfile
    container_name: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: https://arealhr.ru/api
    depends_on:
      - api
    networks:
      - default

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./containers/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - api
      - docs
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - default

  docs:
    build:
      context: .
      dockerfile: containers/docs/Dockerfile
    container_name: docs
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DOCS_PORT}:5173"
    networks:
      - default

volumes:
  pgdata:
  redisdata:

networks:
  default: